<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物语工坊 · 产品视觉工作台</title><meta name="description" content="上传两张实拍图，生成一张主图和九张副图。"><style>:root{--ink:#202624;--muted:#7c837c;--line:#e7e9e2;--cream:#f7f8f3;--white:#fff;--lime:#d9ef75;--forest:#24352d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans','Noto Sans SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:242px;flex:none;background:#18251e;color:#f1f5e8;min-height:100vh;padding:30px 17px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:1px 9px 49px}
.brand-mark{width:39px;height:39px;border-radius:11px;background:var(--lime);color:#203226;display:grid;place-items:center;transform:rotate(-8deg)}
.brand strong{display:block;font-size:17px;letter-spacing:.09em;line-height:1.2}
.brand span{font-size:8px;color:#9daea0;letter-spacing:.15em;font-weight:700}
.sidebar-section{font-size:10px;color:#768c7b;letter-spacing:.15em;padding:0 14px 13px;font-weight:700}
.nav-item{height:44px;display:flex;align-items:center;gap:11px;padding:0 14px;margin-bottom:5px;color:#a5b6a6;font-size:12px;border-radius:9px;white-space:nowrap}
.nav-item.active{background:#344b38;color:#effac7;font-weight:700}
.nav-item.quiet{opacity:.7}
.nav-active-dot{width:5px;height:5px;background:var(--lime);border-radius:50%;margin-left:auto}
.soon{font-size:9px;color:#74927c;margin-left:auto}
.sidebar-bottom{margin-top:auto}
.sidebar-tip{background:linear-gradient(145deg,#314936,#273d2e);border:1px solid #456047;border-radius:13px;padding:20px 17px 17px;margin:0 4px 24px;position:relative;overflow:hidden}

.tip-orbit{color:#d9ef75;margin-bottom:17px}
.sidebar-tip strong{font-size:12px;position:relative;z-index:1}
.sidebar-tip p{font-size:10px;line-height:1.8;color:#adc2ac;margin:7px 0 0;position:relative;z-index:1}
.sidebar-footer{border-top:1px solid #34453a;padding:20px 12px 1px;display:flex;align-items:center;gap:10px;font-size:11px;color:#a1b2a4}
.sidebar-footer svg:last-child{margin-left:auto}
.main-shell{min-width:0;flex:1}
.topbar{height:68px;background:#fff;border-bottom:1px solid #edf0e9;display:flex;align-items:center;justify-content:space-between;padding:0 51px}
.breadcrumb{display:flex;gap:11px;align-items:center;font-size:11px;color:#a0a59f}
.breadcrumb strong{color:#34443a;font-weight:600}
.crumb-slash{color:#cdd2ca}
.topbar-right{display:flex;align-items:center;gap:20px}
.version-pill{border:1px solid #e7ece1;border-radius:100px;background:#f7faf2;color:#60735a;font-size:9px;font-weight:700;letter-spacing:.12em;padding:7px 11px;display:flex;align-items:center;gap:6px}
.version-pill span{height:5px;width:5px;border-radius:50%;background:#8abb75}
.avatar{height:31px;width:31px;border-radius:50%;background:#e8eddb;color:#536950;display:grid;place-items:center;font-size:12px;font-weight:700}
.mobile-brand{display:none}
.content{max-width:1570px;margin:0 auto;padding:28px 51px 24px}
.hero{min-height:263px;background:#e9efdc;border-radius:18px;display:flex;position:relative;overflow:hidden;padding:36px 48px;margin-bottom:28px}
.hero:before{content:'';position:absolute;right:0;top:0;height:100%;width:53%;background:radial-gradient(circle at 50% 60%,#d5e6bc 0,#e9efdc 58%);opacity:.85}
.hero-copy{position:relative;z-index:2;max-width:630px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:9px;font-weight:800;letter-spacing:.16em;color:#58704e}
.eyebrow-line{display:block;width:22px;height:1px;background:#79966c}
.hero h1{font-size:clamp(30px,3vw,43px);line-height:1.39;letter-spacing:-.035em;margin:16px 0 11px;font-weight:800}
.hero h1 em{font-style:normal;color:#3f684a}
.hero p{font-size:12px;line-height:1.9;color:#667365;margin:0}
.hero-meta{display:flex;align-items:center;gap:18px;margin-top:23px}
.hero-meta>div{display:flex;align-items:center;gap:8px;color:#435744;font-size:10px}
.meta-icon{width:28px;height:28px;background:#f4f8e7;border-radius:7px;display:grid;place-items:center}
.meta-icon svg{width:14px;height:14px}
.meta-line{height:15px;width:1px;background:#c7d7bb}
.hero-art{position:absolute;right:21px;top:0;height:100%;width:420px}
.art-grid{position:absolute;inset:0;background-image:linear-gradient(#c8d8bd70 1px,transparent 1px),linear-gradient(90deg,#c8d8bd70 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at 50%,black,transparent 70%);opacity:.45}
.art-card{position:absolute;width:162px;height:196px;border-radius:13px;box-shadow:0 17px 35px #63795d35}
.art-back{background:#ecf2de;right:52px;top:16px;transform:rotate(13deg);border:5px solid #f8f9f1;overflow:hidden}
.art-orbit{position:absolute;border:1px solid #7c9b73;border-radius:50%;width:205px;height:205px;top:25px;left:-17px}
.art-front{background:linear-gradient(145deg,#43604e,#183125);right:132px;top:39px;transform:rotate(-12deg);border:5px solid #fafbf5;overflow:hidden}
.art-glow{width:175px;height:175px;position:absolute;left:-22px;top:8px;border-radius:50%;background:radial-gradient(circle,#c4d6a05c,transparent 65%)}
.art-product{position:absolute;left:49px;top:28px;width:65px;height:132px;filter:drop-shadow(11px 15px 8px #0b251d70)}
.product-top{height:17px;background:linear-gradient(90deg,#e5dec0,#fff5d6,#c1bca3);width:45px;margin:0 auto;border-radius:5px 5px 1px 1px}
.product-body{height:103px;width:59px;margin:0 auto;background:linear-gradient(90deg,#9faa91,#f0f3d9 42%,#b8caa9 85%);border-radius:9px 9px 18px 18px;position:relative}
.product-body:after{content:'STORY';position:absolute;top:42px;left:10px;color:#405b43;letter-spacing:.13em;font-size:8px;font-weight:800}
.product-base{height:4px;width:47px;background:#afbfa6;margin:-2px auto 0;border-radius:50%}
.art-mini-label{position:absolute;bottom:14px;left:15px;color:#f0f3de;font-size:7px;line-height:1.4;letter-spacing:.16em;font-weight:800}
.art-spark{position:absolute;color:#fff;font-size:30px}
.art-spark-one{right:19px;top:91px}.art-spark-two{left:75px;bottom:35px;font-size:23px}
.workspace-grid{display:grid;grid-template-columns:minmax(430px,1fr) minmax(420px,1.05fr);gap:22px;align-items:start}
.setup-column,.story-column{background:#fff;border:1px solid #e8ebe4;border-radius:16px;box-shadow:0 3px 22px #2d423208}
.setup-column{padding:28px 28px 21px}
.section-heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.section-heading>div{display:flex;gap:12px;align-items:flex-start}
.step-count{height:27px;min-width:27px;display:grid;place-items:center;background:#e8f2d9;color:#3f6c42;border-radius:7px;font-size:10px;font-weight:800;margin-top:1px}
.section-heading h2{font-size:16px;margin:1px 0 5px;line-height:1.25;letter-spacing:-.02em}
.section-heading p{font-size:10px;color:#9aa19a;margin:0;line-height:1.6}
.heading-aside,.optional-tag{font-size:9px;color:#acb3aa;white-space:nowrap;margin-top:5px}
.optional-tag{background:#f5f6f2;padding:4px 8px;border-radius:4px;margin-top:0}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload-slot{height:158px;border:1.5px dashed #cdd8c7;border-radius:12px;background:#fafcf8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:.2s}
.upload-slot:hover,.upload-slot.dragging{border-color:#8ab76c;background:#f4f9ec}
.upload-slot.has-photo{border:0;background:#dbe6d4}
.uploaded-photo{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}
.upload-slot.has-photo:after{content:'';position:absolute;inset:48% 0 0;background:linear-gradient(transparent,#15231ecb)}
.upload-icon{height:39px;width:39px;background:#edf5e8;border-radius:9px;color:#689467;display:grid;place-items:center;margin-bottom:11px}
.upload-copy{text-align:center;z-index:1;max-width:90%}
.upload-copy strong{display:block;color:#405342;font-size:11px;margin-bottom:5px}
.upload-copy span{display:block;color:#a0aea0;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-copy.on-photo{position:absolute;bottom:13px;left:14px;text-align:left;max-width:calc(100% - 30px)}
.upload-copy.on-photo strong,.upload-copy.on-photo span{color:#fff}
.upload-copy.on-photo span{opacity:.7}
.upload-hit{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:2}
.remove-photo{position:absolute;right:9px;top:9px;width:26px;height:26px;display:grid;place-items:center;background:#ffffffee;border:0;border-radius:50%;z-index:3;color:#334c36}
.upload-hint{display:flex;align-items:center;gap:6px;font-size:9px;color:#8d9a8c;margin:11px 0 0}
.upload-hint svg{color:#77a67b;flex:none}
.separator{height:1px;background:#edf0e9;margin:25px 0}
.section-heading.second{margin-bottom:18px}
.field{display:flex;flex-direction:column;margin-bottom:14px;gap:8px}
.field label{font-size:10px;color:#59675b;font-weight:700}
.field input,.field textarea{width:100%;border:1px solid #e4e9e1;border-radius:8px;background:#fbfcfa;padding:11px 13px;color:#26352a;font-size:11px;outline:none;resize:vertical;min-height:41px;transition:.2s}
.field input:focus,.field textarea:focus{border-color:#8bab78;box-shadow:0 0 0 3px #8bab7828}
.field input::placeholder,.field textarea::placeholder{color:#b1bab0}
.field-note{color:#a5aea3;font-size:9px;margin-top:-2px}
.look-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.look-card{background:#fff;border:1px solid #e5e9e2;border-radius:9px;padding:9px;text-align:left;position:relative;transition:.2s}
.look-card:hover{transform:translateY(-2px);border-color:#a5c38a}
.look-card.selected{border-color:#6e9c62;box-shadow:0 0 0 1px #6e9c62 inset}
.look-swatch{display:block;height:57px;border-radius:5px;margin-bottom:9px;position:relative;overflow:hidden}
.look-swatch:after{content:'';position:absolute;left:45%;top:12%;width:30%;height:75%;border-radius:50% 50% 25% 25%;transform:rotate(-17deg);box-shadow:8px 8px 13px #0002}
.look-swatch.editorial{background:linear-gradient(120deg,#eef1d8 50%,#b7c8b0 50%)}.look-swatch.editorial:after{background:#395745}
.look-swatch.warm{background:linear-gradient(120deg,#e2c7ac,#f4e7cd)}.look-swatch.warm:after{background:#ad7859}
.look-swatch.modern{background:linear-gradient(120deg,#d1d9d6 50%,#f1f4ef 50%)}.look-swatch.modern:after{background:#577169}
.look-card strong{display:block;color:#415244;font-size:10px;margin-bottom:4px}.look-card small{display:block;font-size:8px;line-height:1.4;color:#a6ada4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look-check{position:absolute;right:15px;top:16px;width:16px;height:16px;border-radius:50%;background:#759e6d;color:white;display:none;place-items:center}
.look-card.selected .look-check{display:grid}
.key-panel{display:flex;gap:11px;background:#f7faf3;border:1px solid #e5eddd;border-radius:10px;padding:15px 13px;margin-top:21px}
.key-panel-icon{width:30px;height:30px;flex:none;display:grid;place-items:center;background:#e6f1dc;color:#668c60;border-radius:8px}
.key-panel-body{flex:1;min-width:0}.key-panel-body strong{display:block;font-size:11px;color:#405543;margin:1px 0 5px}.key-panel-body p{font-size:9px;line-height:1.6;color:#849483;margin:0 0 10px}
.key-panel-body input{width:100%;height:38px;border:1px solid #dce7d8;border-radius:7px;background:white;padding:0 11px;font-size:11px;color:#344f39;outline:none}.key-panel-body input:focus{border-color:#89b477;box-shadow:0 0 0 3px #89b47725}.key-panel-body input::placeholder{color:#a9b7a6}
.key-panel-body a,.key-switch{display:inline-block;margin:8px 10px 0 0;color:#5b8757;font-size:9px;font-weight:700;text-decoration:none}.key-switch{background:none;border:0;padding:0}
.generate-area{margin-top:24px}
.generate-button{width:100%;height:49px;background:#263f2d;color:#f4f9ea;border:0;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;box-shadow:0 8px 16px #30523923;transition:.2s}
.generate-button:hover:not(:disabled){background:#345a3b;transform:translateY(-1px)}
.generate-button:disabled{opacity:.52;box-shadow:none}
.generate-button svg:last-child{margin-left:5px}
.generate-area p{text-align:center;color:#a6aea3;font-size:9px;margin:11px 0 0}
.cancel-button{width:100%;border:0;background:none;color:#6b7969;font-size:10px;margin-top:10px}
.story-column{overflow:hidden}
.story-top{padding:29px 29px 23px;background:#eff4e8;display:flex;justify-content:space-between;min-height:181px;position:relative;overflow:hidden}
.story-top:after{content:'✻';position:absolute;right:40px;top:-72px;color:#dce9d2;font-family:Georgia,serif;font-size:230px;line-height:1}
.eyebrow.dark{font-size:9px;color:#6b8763;position:relative;z-index:1}
.story-top h2{font-size:25px;line-height:1.38;letter-spacing:-.03em;margin:13px 0 9px;position:relative;z-index:1}
.story-top h2 span{color:#80a963;font-size:12px;vertical-align:top;margin-left:3px}
.story-top p{font-size:10px;color:#849081;line-height:1.7;margin:0;position:relative;z-index:1}
.story-number{position:relative;z-index:1;align-self:center;display:flex;flex-direction:column;align-items:center;margin-left:8px}
.story-number strong{font-size:49px;color:#577d59;line-height:1;letter-spacing:-.07em;white-space:nowrap}.story-number strong span{font-size:30px;color:#9ebc80;margin:0 2px}
.story-number small{color:#8ca18a;font-size:9px;letter-spacing:.15em;white-space:nowrap;margin-top:9px}
.story-progress{padding:20px 27px 12px}
.story-progress-top{display:flex;justify-content:space-between;gap:12px;color:#95a194;font-size:10px;min-height:17px}
.story-progress-top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story-progress-top strong{color:#587b55;white-space:nowrap}
.progress-track{height:5px;border-radius:5px;background:#ecf0e9;margin-top:9px;overflow:hidden}.progress-track span{height:100%;display:block;background:#91bd71;border-radius:5px;transition:width .3s}
.story-list{padding:0 15px 4px;max-height:750px;overflow:auto;scrollbar-color:#d7e2d1 transparent;scrollbar-width:thin}
.story-row{min-height:68px;border-bottom:1px solid #edf0eb;display:flex;align-items:center;padding:8px 13px;gap:13px;transition:background .2s}
.story-row:last-child{border-bottom:0}.story-row.current{background:#f8fbf3}.story-row.ready{background:#fdfffb}
.story-thumb{height:51px;width:51px;flex:none;border-radius:7px;display:grid;place-items:center;overflow:hidden;background:#e8eee5;color:#93ac87;font-size:16px;font-weight:700}.story-thumb img{height:100%;width:100%;object-fit:cover}
.thumb-0{background:linear-gradient(135deg,#becdb9,#e3ead2)}.thumb-1{background:linear-gradient(135deg,#e8dfd0,#f5eee4)}.thumb-2{background:linear-gradient(135deg,#d9e2de,#edf2ee)}.thumb-3{background:linear-gradient(135deg,#d9dec6,#f0f1e3)}.thumb-4{background:linear-gradient(135deg,#e1d9d0,#f3eee7)}
.story-row-content{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.story-row-label{font-size:8px;letter-spacing:.11em;color:#a1afa0;font-weight:700}
.story-row-content strong{font-size:11px;line-height:1.2;color:#3d4d40}.story-row-content>span{font-size:9px;color:#a8b0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-row-action{color:#bbc8b8;flex:none;width:27px;display:grid;place-items:center}
.story-row-action button{border:0;background:#eaf3e3;color:#5d895c;border-radius:6px;width:27px;height:27px;display:grid;place-items:center}
.story-footer{margin:10px 25px 23px;background:#f6f8f3;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px}
.story-footer>div{display:flex;align-items:center;gap:7px;font-size:9px;color:#a2aea0;line-height:1.4}.story-footer>div svg{color:#85a67e;flex:none}
.story-footer button{border:0;background:#e0efd6;color:#557c50;font-size:9px;font-weight:700;border-radius:6px;white-space:nowrap;padding:9px 10px;display:flex;align-items:center;gap:5px}.story-footer button:disabled{opacity:.5}
.error-panel{margin:0 25px 23px;color:#a05f52;background:#fff4ef;border-radius:7px;padding:11px;display:flex;gap:8px;font-size:10px;line-height:1.5}
.page-footer{display:flex;justify-content:space-between;gap:12px;color:#a4aca2;font-size:9px;margin:28px 2px 5px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1320px){.sidebar{width:208px}.content{padding:25px 27px}.topbar{padding:0 27px}.hero-art{right:-25px}.hero-copy{max-width:530px}.workspace-grid{grid-template-columns:minmax(400px,1fr) minmax(385px,1fr);gap:16px}.setup-column{padding:23px}.story-top{padding:26px}}
